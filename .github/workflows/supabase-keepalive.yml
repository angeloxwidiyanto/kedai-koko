name: Supabase Keep-Alive (Anti-Pause)

on:
  schedule:
    # Berjalan setiap hari jam 00:00 UTC (07:00 WIB)
    - cron: '0 0 * * *'
  workflow_dispatch: # Memungkinkan tombol 'Run workflow' manual di tab Actions GitHub

jobs:
  keepalive:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          if [ -z "$SUPABASE_URL" ]; then
            SUPABASE_URL="https://yrkqiptozczhrxgcphyg.supabase.co"
          fi

          SUPABASE_KEY="${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"
          if [ -z "$SUPABASE_KEY" ]; then
            SUPABASE_KEY="sb_publishable_-MgYl2DxbxpiULQ2hX9YQg_yQQxUD3q"
          fi

          echo "Pinging Supabase at $SUPABASE_URL/rest/v1/ ..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/")

          echo "Response code: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 500 ]; then
            echo "✅ Keep-alive berhasil! Supabase mencatat aktivitas dan tidak akan pause."
          else
            echo "⚠️ Response status: $HTTP_STATUS"
          fi
